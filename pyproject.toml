[project]
name = "climatextract"
version = "0.3.3"
description = "Extract CO2 emissions data from PDF sustainability reports using LLMs"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{name = "ClimateXtract Team"}]
keywords = ["co2", "emissions", "sustainability", "pdf", "extraction", "llm", "nlp"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "azure-storage-blob",
    "docling>=2.28.4",
    "duckdb>=1.2.2",
    "litellm>=1.83,<2",
    # Only the llama-index pieces the code imports. The meta-package pulls in
    # llama-index-llms-openai, whose openai<2 cap conflicts with litellm>=1.83
    # (openai>=2.8) and makes installs resolve differently across machines.
    "llama-index-core>=0.12.29,<0.14",
    "llama-index-readers-file>=0.4,<0.6",
    "mlflow>=2.21.3",
    "nest-asyncio>=1.6.0",
    "pdf2image>=1.17.0",
    "pydantic>=2.12,<3",
    "PyPDF2>=3.0.1",
    "rich>=14.0.0",
    "tiktoken>=0.11.0",
    "timm>=1.0.15",
    "transformers>=4.45,<5.0",
    "python-dotenv",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5"]
docs = ["zensical", "mkdocs-material", "mkdocstrings[python]", "mkdocs-click"]

[tool.setuptools.packages.find]
include = ["climatextract*"]

[tool.setuptools.package-data]
climatextract = ["data/*.csv"]
